name: test

on:
  push:
  pull_request:

jobs:
  linux_tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        laravel: ['12', '13']
        php: ['8.3', '8.4', '8.5']
        db: ['sqlite', 'mysql']

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.db }}

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql
          tools: composer:v2
          coverage: xdebug

      - name: Setup Problem Matchers
        run: echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        uses: nick-invision/retry@v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 5
          command: composer update --no-interaction --no-progress

      - name: Code Standard and Static Analysis
        if: matrix.db == 'sqlite'
        run: |
          composer run lint:analyse
          composer run stan:analyse

      # Deliberately case-insensitive: it is the collation a channel name would inherit if the
      # one set on pollcast_channel.name were ever dropped, so the tests covering that fail here
      # rather than silently passing the way they do on case-sensitive SQLite.
      - name: Create database
        if: matrix.db == 'mysql'
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -ppassword \
            -e "CREATE DATABASE pollcast CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Execute tests
        run: ./vendor/bin/phpunit --coverage-clover clover.xml
        env:
          DB_CONNECTION: ${{ matrix.db }}
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: pollcast
          DB_USERNAME: root
          DB_PASSWORD: password

      - name: Check code coverage
        uses: codecov/codecov-action@v7
        if: "matrix.php == '8.1' && matrix.laravel == '10'"
